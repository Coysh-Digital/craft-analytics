<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!--
      Ids are prefixed, not reused from the other plugins: the Plugin Store
      lists several icons on one page, and duplicate gradient ids would have
      each plugin painted in whichever one loaded last.
    -->
    <linearGradient id="caBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="caSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#caBg)"/>
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#caSheen)"/>
  <!-- trend line -->
  <g fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 53 L43 40 L53 48 L70 25"/>
    <path d="M58 25 L70 25 L70 37"/>
  </g>
  <!-- measured bars -->
  <g fill="#ffffff">
    <rect x="27" y="73" width="11" height="12" rx="3" fill-opacity="0.75"/>
    <rect x="44.5" y="65" width="11" height="20" rx="3" fill-opacity="0.88"/>
    <rect x="62" y="58" width="11" height="27" rx="3"/>
  </g>
</svg>
